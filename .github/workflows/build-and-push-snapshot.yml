# This workflow will build the container image for linux amd64, arm64 and push it to registry
name: Build-Push-Image-Snapshot

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  archs: linux/amd64,linux/arm64

run-name: Build and Push Snapshot

jobs:
# Job for building and pushing a snapshot image
  build-develop:
    runs-on: ubuntu-latest
    steps:
    # Log in to GitHub Container Registry
    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GH_PAT }}
        registry: ghcr.io

    # Set up QEMU
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
  
    # Setup Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build and push image in multiple architectures
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:snapshot
        platforms: ${{ env.archs }}

    # Delete old develop images now untagged after new one is pushed
    - name: Delete old SNAPSHOT images
      uses: actions/delete-package-versions@v4
      with:
        package-name: '${{ github.event.repository.name }}'
        package-type: 'container'
        delete-only-untagged-versions: 'true'
        token: ${{ secrets.GH_PAT }}
