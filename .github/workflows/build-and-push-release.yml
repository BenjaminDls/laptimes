# This workflow will build the container image for linux amd64, arm64 and push it to registry
name: Build-Push-Image-Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  archs: linux/amd64,linux/arm64

run-name: Build and Push Release -- ${{ github.ref_name }}

jobs:
# Job for building and pushing a release image
  build-release:
    runs-on: ubuntu-latest
    steps:
    # Get the code
    - name: Checkout
      uses: actions/checkout@v4

    # Get version and store in environment variable
    - name: Get version
      id: get-version
      run: |
        version=$(./gradlew -q printVersion)
        echo "projectVersion=$version" >> "$GITHUB_OUTPUT"

    # Set up QEMU
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
  
    # Setup Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Log in to GitHub Container Registry
    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GH_PAT }}
        registry: ghcr.io

    # Build and push image for multiple architectures
    - name: Build and push
      uses: docker/build-push-action@v5
      env:
        PROJECT_VERSION: ${{ steps.get-version.outputs.projectVersion }}
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.PROJECT_VERSION }} , ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
        platforms: ${{ env.archs }}

