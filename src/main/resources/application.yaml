server:
  port: 9000
spring:
  datasource:
    url: jdbc:\${dbprotocol}://\${dbhost}:\${dbport}/\${dbname}
    username: \${dbuser}
    password: \${dbpass}
    driver-class-name: \${dbdriver}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: \${dbdialect}

logging:
  file:
    path: /var/log/laptimes

listenAddress:
game:
  port:
    f12022: 20777
    assettocorsa: 9996

discord:
  token: \${discord_token}
  bot:
    id: \${discord_bot_id}
  events:
    channelId: \${discord_events_channelId}
    games:
      - AssettoCorsa
  devmode: false

project:
  version: ${version?:dev}